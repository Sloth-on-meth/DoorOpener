name: Docker Build and Push

on:
  # Only run Docker build/push after the CI workflow has completed successfully on main/master
  workflow_run:
    workflows: ["CI"]
    branches: ["main", "master"]
    types: [completed]
  # Also allow manual pushing on release publish
  release:
    types: [published]

jobs:
  docker:
    # Gate: run only when CI succeeded (workflow_run) or on release events
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'release')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin





      # QEMU lets the amd64 runner build the linux/arm64 variant (Raspberry Pi, Banana Pi, ...).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: reponame
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (post-CI success)
        if: github.event_name == 'workflow_run'
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ steps.reponame.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ steps.reponame.outputs.repository }}:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
